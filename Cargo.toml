[workspace]
resolver = "3"

members = [
    "osm_pbf",
    "tiles",
    "util",
    "cache",
    "build_tiles",
    "preview_tiles",
]

[workspace.dependencies]
thiserror = "2.0"
error-stack = "0.7"
serde = { version = "1.0", features = ["derive"] }
prost-build = "0.14"
prost = "0.14"
flate2 = { version = "1.1", default-features = false, features = ["zlib"]}
nohash-hasher = "0.2"
bytemuck = { version = "1.25", features = ["derive"] }
geo = "0.33"
hashbrown = { version = "0.17", features = ["rayon"] }
itertools = "0.15"
rayon = "1"
memmap2 = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
async-trait = "0.1"
futures = "0.3"
clap = { version = "4.6", features = ["derive"] }
